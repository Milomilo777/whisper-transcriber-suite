# Cloudflare Worker for usage statistics and problem reports. Deployment: README.md in this folder.
# No secrets here: STATS_USER and STATS_PASSWORD are set with `wrangler secret put`.
name = "wts-stats"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "stats.whisper-transcriber-suite.com", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "wts-stats"
database_id = "6735675d-4a3c-44e1-b4f0-6145954fef85"

# Daily purge of the oldest rows (src/index.js purgeOld).
[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = false
