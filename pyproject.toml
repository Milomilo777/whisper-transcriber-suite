[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-transcriber-suite"
version = "1.9.2"
description = "Local Whisper desktop app — offline transcription + yt-dlp/SMTV download + oTranscribe round-trip"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "translation-robot" }]
keywords = ["whisper", "transcription", "speech-to-text", "yt-dlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "faster-whisper>=1.0.3",
    "requests>=2.31.0",
    "sv-ttk>=2.6.0",
    "platformdirs>=4.0.0",
    # Session-13 / Session-14 runtime deps that were previously
    # only in requirements.txt — kept here too so `pip install
    # whisper-transcriber-suite` yields a runnable install.
    "python-docx>=1.0",
    "tkinterdnd2>=0.4.0",
    "sherpa-onnx>=1.10",
    "python-vlc>=3.0",
    "reportlab>=4.0",
    "watchdog>=3.0",
    "pystray>=0.19",
    "Pillow>=10.0",
    "psutil>=5.9",
    # Live tab audio capture — small, no heavy transitive deps, so these
    # ship by default rather than through the opt-in extras below (see
    # requirements.txt for why). PyAudioWPatch is Windows-only (WASAPI
    # loopback for the "System audio" source).
    "sounddevice>=0.4.6",
    "PyAudioWPatch>=0.2.12.6; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "responses>=0.25",
    "pyright>=1.1.350",
]
crash_reporting = [
    "sentry-sdk>=1.40,<3",
]
theme_detection = [
    "darkdetect>=0.8.0",
]
backend_cpp = [
    # whisper.cpp backend — opt-in because the ggml model download
    # is 1.1 GB and pywhispercpp transitively pulls a native lib.
    "pywhispercpp>=1.4",
]
alignment = [
    # stable-ts word-level alignment — opt-in because it transitively
    # pulls torch (~125 MB).
    "stable-ts>=2.17",
]
nvidia_asr = [
    # Local NVIDIA Parakeet / FastConformer ASR backend (transcribe_backend=
    # "nvidia_asr") — opt-in because transformers + torch + librosa are
    # heavy (GBs with the model weights) and install on first use via
    # core/optional_deps.py for a normal app run; this group just lets a
    # source checkout / dev environment pre-install the same three.
    # Keep the transformers upper bound in sync with core/optional_deps.py's
    # nvidia_asr entry and the tokenizers pin in requirements.txt — see the
    # comment there for why an unpinned "latest transformers" breaks this.
    "transformers>=4.40,<=5.15.0",
    "torch>=2.2",
    "librosa>=0.10",
]

[project.scripts]
whisper-transcriber-suite = "app:run"

[project.urls]
Homepage = "https://github.com/Milomilo777/whisper-transcriber-suite"
Repository = "https://github.com/Milomilo777/whisper-transcriber-suite"
Author = "https://github.com/translation-robot"

[tool.setuptools.packages.find]
include = ["app*", "core*"]
exclude = ["tests*", "build*", "dist*", "docs*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# A per-test wall-clock ceiling: a hung thread (blocked socket, dead
# server loop, etc.) fails that one test with a full thread dump instead
# of hanging CI for hours. "thread" method uses a watchdog thread so it
# still fires even if the hang is in a blocking C call that swallows
# signals.
addopts = "-q --timeout=120 --timeout-method=thread"

[tool.coverage.run]
branch = false
source = ["core", "app"]
omit = ["**/__pycache__/*", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.pyright]
include = ["core", "app"]
exclude = ["**/__pycache__", "build", "dist", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false
