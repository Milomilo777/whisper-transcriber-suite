name: yt-dlp watch

# Every day: install the newest yt-dlp and ask it for the metadata of a few stable public media pages
# (tools/ytdlp_watch_urls.json). A broken extractor fails the run, and GitHub then emails the maintainer.
# A site that refuses the CI network only warns (see tools/ytdlp_watch.py).

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

concurrency:
  group: ytdlp-watch
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the newest yt-dlp
        run: python -m pip install --upgrade "yt-dlp[default]"
      - name: Check the sample pages
        run: python tools/ytdlp_watch.py
