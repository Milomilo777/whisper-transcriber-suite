name: Windows installer

# Builds the Windows installer and the Portable ZIP from the committed tree on a clean runner,
# the same way as docs/BUILD.md "Method C":
#   * every third-party download (python-build-standalone, ffmpeg/ffprobe, yt-dlp, Deno, the two
#     diarization models, Inno Setup) comes from platform/windows/build-deps.json at a pinned URL
#     and must match the size and SHA-256 recorded there (tools/fetch_windows_build_deps.py);
#   * build_embed_installer.bat fails the build when a DLL or extension module in the tree imports
#     a DLL that is neither in the tree nor part of Windows 10 (tools/check_embed_tree.py), and the
#     same check runs on the installed copy, so a runner that happens to have the Visual C++
#     runtime installed cannot hide a missing one;
#   * the installer is installed silently on the runner, smoke-tested with the installed
#     interpreter and uninstalled again;
#   * the outputs are workflow artifacts kept for 7 days, plus a file manifest of the build.
# It never creates a release or a tag and uses no secrets: publishing stays a manual step
# (docs/RELEASE_PROCESS.md). Python packages come from PyPI per requirements.txt; the exact
# versions of a run are in the manifest artifact (site-packages.txt).

on:
  push:
    branches: [master, codex/integration-2.4.x]
    paths:
      - build_embed_installer.bat
      - installer_embed.iss
      - installer.iss
      - whisper_project_onedir.spec
      - requirements.txt
      - platform/windows/build-deps.json
      - tools/fetch_windows_build_deps.py
      - tools/check_embed_tree.py
      - tools/build_manifest.py
      - tools/smoke_windows_install.py
      - tools/smoke_windows_predecessor.py
      - tools/smoke_windows_upgrade.py
      - tools/check_installer_upgrade_files.py
      - tools/qa/**
      - .github/workflows/windows-installer.yml
      # What ships inside the build: a change here can break the install too.
      - gui.py
      - app/**
      - core/**
      - assets/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  # Never cancel a running build (it may be a release candidate) when a later
  # push arrives; GitHub keeps at most one newer run waiting behind it.
  cancel-in-progress: false

jobs:
  build:
    name: installer + Portable ZIP
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Only runs the helper scripts; the shipped interpreter is the pinned
      # python-build-standalone release that build_embed_installer.bat unpacks.
      - name: Set up Python for the build scripts
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Read the app version
        shell: pwsh
        run: |
          $m = Select-String -Path installer_embed.iss -Pattern '^#define MyAppVersion "([^"]+)"'
          if (-not $m) { throw 'MyAppVersion not found in installer_embed.iss' }
          $ver = $m.Matches[0].Groups[1].Value
          "APP_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Host "version $ver"

      # pwsh steps only fail on the last command's exit code, so every native
      # call below checks $LASTEXITCODE itself.
      - name: Check retired packaged paths against the last release
        shell: pwsh
        run: |
          python tools/check_installer_upgrade_files.py
          if ($LASTEXITCODE -ne 0) { throw 'Overlay upgrade inventory guard failed; see retired paths or missing-history error' }

      - name: Fetch the pinned binaries into bin\
        shell: pwsh
        run: |
          python tools/fetch_windows_build_deps.py
          if ($LASTEXITCODE -ne 0) { throw 'fetch failed' }
          python tools/fetch_windows_build_deps.py --check
          if ($LASTEXITCODE -ne 0) { throw 'bin\ does not match the pins' }

      - name: Install the pinned Inno Setup
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          python tools/fetch_windows_build_deps.py --only inno-setup --out $setup
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup download failed' }
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=$dir")
          if ($p.ExitCode -ne 0) { throw "Inno Setup install exited $($p.ExitCode)" }
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe missing in $dir" }
          "ISCC=$iscc" >> $env:GITHUB_ENV
          "WHISPER_SMOKE_INNO_COMPILER=$iscc" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force build-manifest | Out-Null
          $sdk = Get-Item -LiteralPath $iscc
          $engine = Get-Item -LiteralPath (Join-Path $dir 'ISCmplr.dll')
          $probe = @'
          import hashlib, json, os, pathlib, re, subprocess, sys
          iscc = pathlib.Path(sys.argv[1])
          engine = iscc.with_name('ISCmplr.dll')
          manifest = pathlib.Path('build-manifest')
          pins = json.loads(pathlib.Path('platform/windows/build-deps.json').read_text(encoding='utf-8'))
          declared = next(item for item in pins['deps'] if item['name'] == 'inno-setup')
          probe = subprocess.run([str(iscc), '-'], input=b'', capture_output=True,
                                 timeout=30, creationflags=subprocess.CREATE_NO_WINDOW)
          stdout = probe.stdout.decode('utf-8', errors='replace')
          stderr = probe.stderr.decode('utf-8', errors='replace')
          (manifest / 'inno-compiler-probe.stdout.log').write_text(stdout, encoding='utf-8')
          (manifest / 'inno-compiler-probe.stderr.log').write_text(stderr, encoding='utf-8')
          match = re.search(r'Compiler engine version:\s*Inno Setup\s+(\d+\.\d+\.\d+)', stdout)
          record = {
              'source_head': os.environ['GITHUB_SHA'],
              'declared_package_version': declared['version'],
              'declared_package_sha256': declared['sha256'],
              'runtime_engine_version': match.group(1) if match else None,
              'compiler_path': str(iscc),
              'compiler_file_version': sys.argv[2],
              'compiler_product_version': sys.argv[3],
              'engine_file_version': sys.argv[4],
              'engine_product_version': sys.argv[5],
              'iscc_sha256': hashlib.sha256(iscc.read_bytes()).hexdigest(),
              'iscmplr_sha256': hashlib.sha256(engine.read_bytes()).hexdigest(),
              'probe_exit': probe.returncode,
          }
          (manifest / 'inno-compiler.json').write_text(json.dumps(record, indent=2), encoding='utf-8')
          # Empty stdin intentionally fails compilation without executing Setup.
          if (probe.returncode != 2 or 'AppName' not in stderr or not match
                  or match.group(1) != declared['version']):
              raise SystemExit('Pinned Inno compiler runtime engine identity probe failed')
          '@
          $probe | python - "$iscc" "$($sdk.VersionInfo.FileVersion)" "$($sdk.VersionInfo.ProductVersion)" "$($engine.VersionInfo.FileVersion)" "$($engine.VersionInfo.ProductVersion)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the pinned Inno runtime compiler identity' }

      - name: Build the embed tree (build_embed_installer.bat)
        shell: cmd
        run: call build_embed_installer.bat

      - name: Check the bundled binaries in embed_build\ against the pins
        shell: pwsh
        run: |
          python tools/fetch_windows_build_deps.py --check --root embed_build
          if ($LASTEXITCODE -ne 0) { throw 'embed_build\bin does not match the pins' }
          python tools/fetch_windows_build_deps.py --check --select msvc-runtime --root embed_build
          if ($LASTEXITCODE -ne 0) { throw 'embed_build\python Visual C++ runtime DLLs do not match the pins' }

      - name: Build the real Compact payload
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'wts-compact-venv'
          $buildLog = Join-Path $env:RUNNER_TEMP 'wts-compact-build.log'
          python -m venv $venv 2>&1 | Tee-Object -FilePath $buildLog
          if ($LASTEXITCODE -ne 0) { throw 'Compact build environment creation failed' }
          $compactPython = Join-Path $venv 'Scripts/python.exe'
          & $compactPython -m pip install -r requirements.txt pyinstaller 2>&1 | Tee-Object -FilePath $buildLog -Append
          if ($LASTEXITCODE -ne 0) { throw 'Compact build dependency installation failed' }
          New-Item -ItemType Directory -Force build-manifest | Out-Null
          & $compactPython -m pip list --format freeze | Out-File -Encoding utf8 build-manifest/compact-site-packages.txt
          if ($LASTEXITCODE -ne 0) { throw 'Compact build package inventory failed' }
          $pyinstallerVersion = & $compactPython -m PyInstaller --version
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the actual PyInstaller version' }
          $pythonVersion = & $compactPython -c "import platform; print(platform.python_version())"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the Compact build Python version' }
          [ordered]@{
            source_head = $env:GITHUB_SHA
            python = "$pythonVersion"
            pyinstaller = "$pyinstallerVersion"
            spec = 'whisper_project_onedir.spec'
            dist = 'dist_onedir/WhisperTranscriberSuite'
          } | ConvertTo-Json | Set-Content -Encoding utf8 build-manifest/compact-build.json
          & $compactPython -m PyInstaller --noconfirm --clean --distpath dist_onedir --workpath "$env:RUNNER_TEMP/wts-compact-pyinstaller" whisper_project_onedir.spec 2>&1 | Tee-Object -FilePath $buildLog -Append
          if ($LASTEXITCODE -ne 0) { throw 'Real Compact PyInstaller build failed' }
          if (-not (Test-Path -LiteralPath 'dist_onedir/WhisperTranscriberSuite/WhisperTranscriberSuite.exe' -PathType Leaf)) {
            throw 'Real Compact payload executable is missing'
          }

      - name: Compile both installers and verify predecessor isolation
        shell: pwsh
        run: |
          python tools/smoke_windows_predecessor.py `
            --source "$env:GITHUB_WORKSPACE" `
            --iscc "$env:ISCC" `
            --expected-head "${{ github.sha }}" `
            --work-dir "$env:RUNNER_TEMP/wts-predecessor-compiled" `
            --confirm-disposable-vm `
            --confirm-clean-machine
          if ($LASTEXITCODE -ne 0) { throw 'Compiled predecessor isolation gate failed; see retained compile and native-case logs' }

      - name: Promote the guard-tested embed installer
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'wts-predecessor-compiled'
          $result = Get-Content -LiteralPath (Join-Path $work 'result.json') -Raw | ConvertFrom-Json
          if ($result.status -ne 'PASS' -or $result.expected_head -ne $env:GITHUB_SHA) {
            throw 'Native predecessor result does not accept this exact source head'
          }
          $expectedHash = [string]$result.compiled.embed.sha256
          if ($expectedHash -notmatch '^[0-9a-fA-F]{64}$') { throw 'Guard-tested embed SHA-256 is missing or invalid' }
          $source = (Resolve-Path -LiteralPath $result.compiled.embed.path).Path
          $compiledDir = [IO.Path]::GetFullPath((Join-Path $work 'compiled/embed'))
          if (-not [string]::Equals([IO.Path]::GetDirectoryName($source), $compiledDir, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Guard-tested embed binary is outside its owned compiled directory'
          }
          if ((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Guard-tested embed binary changed after native acceptance'
          }
          New-Item -ItemType Directory -Force dist_installer | Out-Null
          $target = Join-Path 'dist_installer' "WhisperTranscriberSuite-Installer-Windows-v$env:APP_VERSION.exe"
          Copy-Item -LiteralPath $source -Destination $target -Force
          if ((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Published installer bytes differ from the guard-tested embed binary'
          }

      - name: Install pytest for compiled Windows smoke checks
        shell: pwsh
        run: |
          $smokePython = Join-Path (Join-Path $env:RUNNER_TEMP 'wts-compact-venv') 'Scripts/python.exe'
          & $smokePython -m pip install pytest pytest-timeout
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the compiled smoke test runner' }
          $oldScript = Join-Path $env:RUNNER_TEMP 'wts-inno-smoke-history/installer_embed.iss'
          & $smokePython -c "import pathlib, subprocess, sys; target = pathlib.Path(sys.argv[1]); target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(subprocess.check_output(['git', 'show', 'v2.3.1:installer_embed.iss']))" $oldScript
          if ($LASTEXITCODE -ne 0) { throw 'Could not materialize the historical installer script for native smoke checks' }
          "WHISPER_SMOKE_OLD_INSTALLER_SCRIPT=$oldScript" >> $env:GITHUB_ENV

      - name: Run compiled Windows smoke regressions
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WHISPER_SMOKE_INNO_COMPILER) -or -not (Test-Path -LiteralPath $env:WHISPER_SMOKE_INNO_COMPILER -PathType Leaf)) {
            throw 'Pinned Inno compiler is required for Windows smoke checks'
          }
          if (-not (Test-Path -LiteralPath $env:WHISPER_SMOKE_OLD_INSTALLER_SCRIPT -PathType Leaf)) {
            throw 'Historical installer script is required for Windows smoke checks'
          }
          $smokePython = Join-Path (Join-Path $env:RUNNER_TEMP 'wts-compact-venv') 'Scripts/python.exe'
          $smokeWork = Join-Path $env:RUNNER_TEMP 'wts-inno-smoke'
          New-Item -ItemType Directory -Force $smokeWork | Out-Null
          & $smokePython -m pytest tests/smoke/test_inno_compile.py tests/smoke/test_inno_data_preservation.py tests/smoke/test_inno_shortcut_upgrade.py -q -ra --junitxml="$smokeWork/results.xml" --basetemp="$smokeWork/cases" 2>&1 | Tee-Object -FilePath (Join-Path $smokeWork 'pytest.log')
          if ($LASTEXITCODE -ne 0) { throw 'Compiled Windows smoke regressions failed; see retained XML and logs' }
          & $smokePython -c "import sys, xml.etree.ElementTree as ET; cases = ET.parse(sys.argv[1]).getroot().findall('.//testcase'); assert cases and not any(c.find(kind) is not None for c in cases for kind in ('skipped', 'error', 'failure')), 'Compiled smoke cases must execute and pass without skips'" "$smokeWork/results.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Compiled Windows smoke evidence contains skipped or missing cases' }

      - name: Zip the Portable build
        shell: pwsh
        run: |
          $zip = "dist_installer/WhisperTranscriberSuite-Portable-Windows-v$env:APP_VERSION"
          python -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', 'embed_build')" $zip
          if ($LASTEXITCODE -ne 0) { throw 'zip failed' }

      - name: Write the build manifest
        shell: pwsh
        run: |
          python tools/build_manifest.py write embed_build build-manifest/embed_build.json
          if ($LASTEXITCODE -ne 0) { throw 'manifest of embed_build failed' }
          python tools/build_manifest.py write dist_installer build-manifest/dist_installer.json
          if ($LASTEXITCODE -ne 0) { throw 'manifest of dist_installer failed' }
          & embed_build\python\python.exe -m pip list --path embed_build\Lib\site-packages --format freeze |
            Out-File -Encoding utf8 build-manifest\site-packages.txt
          if ($LASTEXITCODE -ne 0) { throw 'pip list failed' }
          Get-ChildItem dist_installer | Format-Table Name, Length -AutoSize

      # The Portable ZIP is an archive of embed_build\, so the same checks run on that tree
      # (after the manifest, so the __pycache__ this writes is not listed there).
      - name: Smoke test the Portable tree (embed_build)
        shell: pwsh
        run: |
          & embed_build\python\python.exe tools\smoke_windows_install.py (Resolve-Path embed_build).Path $env:APP_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Portable smoke test failed ($LASTEXITCODE)" }

      - name: Real v2.3.1 upgrade and uninstall at default Program Files
        shell: pwsh
        run: |
          python tools/smoke_windows_upgrade.py `
            --installer "dist_installer/WhisperTranscriberSuite-Installer-Windows-v$env:APP_VERSION.exe" `
            --expected-version "$env:APP_VERSION" `
            --work-dir "$env:RUNNER_TEMP/wts-historical-upgrade" `
            --confirm-clean-machine
          if ($LASTEXITCODE -ne 0) { throw 'Pinned historical upgrade/uninstall gate failed; see lifecycle logs' }

      - name: Smoke test (silent install, imports, bundled tools, upgrade, uninstall)
        shell: pwsh
        run: |
          $setup = "dist_installer\WhisperTranscriberSuite-Installer-Windows-v$env:APP_VERSION.exe"
          $dir = Join-Path $env:RUNNER_TEMP 'wts-install'
          $log = Join-Path $env:RUNNER_TEMP 'wts-install.log'
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$dir", "/LOG=$log")
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "silent install exited $($p.ExitCode)" }
          python tools/fetch_windows_build_deps.py --check --root $dir
          if ($LASTEXITCODE -ne 0) { throw 'the installed bin\ does not match the pins' }
          python tools/fetch_windows_build_deps.py --check --select msvc-runtime --root $dir
          if ($LASTEXITCODE -ne 0) { throw 'the installed Visual C++ runtime DLLs do not match the pins' }
          # Before the smoke test, which makes Python write __pycache__ into app\ and core\.
          & (Join-Path $dir 'python\python.exe') -I tools\check_embed_tree.py $dir
          if ($LASTEXITCODE -ne 0) { throw 'the installed tree imports a DLL it does not carry' }
          & (Join-Path $dir 'python\python.exe') tools\smoke_windows_install.py $dir $env:APP_VERSION
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed ($LASTEXITCODE)" }
          # Exercise real user additions during upgrade and eventual uninstall.
          $sentinels = @('app', 'core', 'bin', 'assets', 'python', 'Lib') | ForEach-Object {
            $folder = Join-Path $dir $_
            New-Item -ItemType Directory -Force $folder | Out-Null
            $path = Join-Path $folder 'user-preservation-fixture.txt'
            [IO.File]::WriteAllText($path, 'synthetic user original')
            $path
          }
          $log2 = Join-Path $env:RUNNER_TEMP 'wts-upgrade.log'
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$dir", "/LOG=$log2")
          if ($p.ExitCode -ne 0) { Get-Content $log2 -Tail 40; throw "upgrade install exited $($p.ExitCode)" }
          if (-not (Select-String -Path $log2 -SimpleMatch 'Upgrade in place; existing user additions are preserved.' -Quiet)) {
            Get-Content $log2 -Tail 60; throw 'the upgrade did not use the preserving in-place path' }
          foreach ($path in $sentinels) {
            if (-not (Test-Path $path) -or [IO.File]::ReadAllText($path) -ne 'synthetic user original') {
              throw 'upgrade destroyed user additions' }
          }
          & (Join-Path $dir 'python\python.exe') tools\smoke_windows_install.py $dir $env:APP_VERSION
          if ($LASTEXITCODE -ne 0) { throw "smoke test after the upgrade failed ($LASTEXITCODE)" }
          $p = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
          if ($p.ExitCode -ne 0) { throw "silent uninstall exited $($p.ExitCode)" }
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir 'python\python.exe')); $i++) { Start-Sleep 2 }
          if (Test-Path (Join-Path $dir 'python\python.exe')) { throw 'uninstall left the python folder behind' }
          foreach ($path in $sentinels) {
            if (-not (Test-Path $path) -or [IO.File]::ReadAllText($path) -ne 'synthetic user original') {
              throw 'uninstall destroyed user additions' }
          }
          Write-Host 'uninstall removed tracked app files and preserved user additions'

      - name: Upload the installer and the Portable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-${{ github.sha }}
          path: |
            dist_installer/*.exe
            dist_installer/*.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Hosted native AltGr acceptance at the exact source SHA
        timeout-minutes: 3
        shell: pwsh
        env:
          QA_EXPECTED_HEAD: ${{ github.sha }}
          QA_ALTGR_KLID: '00020407'
        run: |
          $qaPython = Join-Path (Join-Path $env:RUNNER_TEMP 'wts-compact-venv') 'Scripts/python.exe'
          $qaResults = Join-Path $env:RUNNER_TEMP 'wts-altgr'
          $qaManifest = Join-Path $env:GITHUB_WORKSPACE 'build-manifest/hosted-altgr'
          $qaExit = 1
          try {
            & $qaPython tools/qa/hosted_altgr_loader.py
            $qaExit = $LASTEXITCODE
          } finally {
            if (Test-Path -LiteralPath $qaResults) {
              New-Item -ItemType Directory -Path $qaManifest -Force | Out-Null
              Copy-Item -LiteralPath $qaResults -Destination (Join-Path $qaManifest 'wts-altgr') -Recurse
            }
          }
          # Environment skips are reported in retained JSON/JUnit until the
          # first hosted PASS qualifies this acceptance as a hard gate.
          if ($qaExit -ne 0) { throw 'Hosted AltGr acceptance failed or lacks complete A/C/X/V coverage; inspect retained evidence' }

      - name: Upload the build manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-manifest-${{ github.sha }}
          path: |
            build-manifest/
            ${{ runner.temp }}/wts-historical-upgrade/*.json
            ${{ runner.temp }}/wts-historical-upgrade/*.log
            ${{ runner.temp }}/wts-predecessor-compiled/result.json
            ${{ runner.temp }}/wts-predecessor-compiled/**/*.json
            ${{ runner.temp }}/wts-predecessor-compiled/**/*.log
            ${{ runner.temp }}/wts-compact-build.log
            ${{ runner.temp }}/wts-inno-smoke/*.xml
            ${{ runner.temp }}/wts-inno-smoke/**/*.log
            ${{ runner.temp }}/wts-altgr/**
          retention-days: 7
          if-no-files-found: warn
