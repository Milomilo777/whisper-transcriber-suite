name: IndexNow

# After the website changes, tell IndexNow search engines (Bing, Yandex,
# Seznam, Naver, Yep) to recrawl it. Commits made by the "Website data"
# workflow ping from there instead (GITHUB_TOKEN pushes don't trigger this).

on:
  push:
    branches: [master]
    paths: ["site/**"]
  workflow_dispatch:

concurrency:
  group: indexnow
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Wait for the Pages deploy, then ping
        run: |
          sleep 60
          python tools/indexnow_ping.py --wait 300
