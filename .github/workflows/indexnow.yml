name: IndexNow

# After the website changes, tell IndexNow search engines (Bing, Yandex,
# Seznam, Naver, Yep) to recrawl it.

on:
  push:
    branches: [master]
    paths: ["site/**"]
  workflow_dispatch:

concurrency:
  group: indexnow
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Wait for the Pages deploy, then ping
        run: |
          sleep 60
          python tools/indexnow_ping.py --wait 300
