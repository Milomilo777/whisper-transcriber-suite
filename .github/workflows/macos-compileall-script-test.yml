name: macOS compileall-whisper-mac.sh test

# Dedicated, manual-only workflow that exercises
# platform/macos/pyinstaller/compileall-whisper-mac.sh exactly as authored
# (rm -rf dist -> pyinstaller build -> create-dmg wrap) on a real macOS
# runner, separate from macos-app.yml's own build+dmg steps so a routine
# run of that workflow doesn't pay for a second full rebuild just to
# re-verify this script.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-script:
    name: Run compileall-whisper-mac.sh (arm64)
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps (slim) + PyInstaller + create-dmg
        run: |
          python -m pip install --upgrade pip
          grep -viE '^stable-ts' requirements.txt > requirements.slim.txt
          pip install -r requirements.slim.txt
          pip install pyinstaller
          brew install create-dmg

      - name: Pin numpy to a Monterey/VM-safe 1.x
        run: pip install "numpy==1.26.4"

      # Homebrew's ffmpeg links Homebrew dylibs; the mac spec detects that
      # and replaces bin/ with self-contained tools (fetch_mac_binaries.sh),
      # so this step checks that a colleague-style bin/ still builds cleanly.
      - name: Provide macOS ffmpeg/ffprobe in bin/ (Homebrew, replaced by the spec)
        run: |
          brew install ffmpeg
          mkdir -p bin
          cp "$(brew --prefix)/bin/ffmpeg"  bin/ffmpeg
          cp "$(brew --prefix)/bin/ffprobe" bin/ffprobe
          chmod +x bin/ffmpeg bin/ffprobe

      - name: Run the script itself
        run: bash platform/macos/pyinstaller/compileall-whisper-mac.sh

      - name: Verify the .app is self-contained
        run: bash platform/macos/pyinstaller/verify_mac_bundle.sh "dist/Whisper Transcriber Suite.app" arm64

      - name: Verify the .dmg was produced
        run: |
          DMG="dist/Whisper Transcriber Suite-arm64.dmg"
          [ -f "$DMG" ] || { echo "ERROR: $DMG not found" >&2; exit 1; }
          ls -la "$DMG"
          file "$DMG"

      - name: Upload .app + .dmg
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compileall-script-output
          path: |
            dist/*.app
            dist/*.dmg
          if-no-files-found: warn

      # The colleague's other habit: the Windows onedir spec from the repo
      # root, which hands over to the mac spec on macOS. Separate dist/build
      # folders so the script's output above stays untouched.
      - name: Repo-root spec builds the same .app
        run: |
          pyinstaller --noconfirm --clean --distpath dist_root --workpath build_root whisper_project_onedir.spec
          bash platform/macos/pyinstaller/verify_mac_bundle.sh "dist_root/Whisper Transcriber Suite.app" arm64
