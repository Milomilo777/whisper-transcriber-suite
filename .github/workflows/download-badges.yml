name: Download badges

on:
  schedule:
    - cron: "23 */6 * * *"
  release:
    types: [published, created, edited]
  workflow_dispatch:

concurrency:
  group: download-badges
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Refresh the badges data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          badge_dir="$(mktemp -d)/badges"
          ref=refs/heads/badges
          if git ls-remote --exit-code --heads origin "$ref" >/dev/null; then
            git fetch --no-tags origin "$ref"
            git worktree add --detach "$badge_dir" FETCH_HEAD
          else
            status=$?
            if [[ "$status" != 2 ]]; then exit "$status"; fi
            git worktree add --orphan -b badges "$badge_dir"
            printf '# Download badges\n\nGenerated by GitHub Actions. Do not edit.\n' > "$badge_dir/README.md"
          fi

          python tools/download_badges.py "$GITHUB_REPOSITORY" "$badge_dir"
          git -C "$badge_dir" add -- README.md '*.svg'
          if git -C "$badge_dir" diff --cached --quiet; then
            exit 0
          fi
          git -C "$badge_dir" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Refresh download badges'
          git -C "$badge_dir" push origin "HEAD:$ref"
