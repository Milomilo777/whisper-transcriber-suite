name: Download badges

on:
  schedule:
    - cron: "23 */6 * * *"
  release:
    types: [published, created, edited]
  workflow_dispatch:

concurrency:
  group: download-badges
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    # The refresh job needs write access to publish the generated badges.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Refresh the download badges on master
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -L docs || -L docs/badges ]]; then
            echo 'The badge output directory must not be a symlink.' >&2
            exit 1
          fi

          python tools/download_badges.py "$GITHUB_REPOSITORY" docs/badges
          outside=$(git status --porcelain --untracked-files=all --no-renames -- . ':(exclude,top,glob)docs/badges/*.svg')
          if [[ -n "$outside" ]]; then
            echo 'Refusing to publish changes outside docs/badges/*.svg.' >&2
            exit 1
          fi
          git add -- ':(top,glob)docs/badges/*.svg'
          if git diff --cached --quiet; then
            exit 0
          fi

          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          base=$(git rev-parse HEAD)
          git commit -m '[skip ci] Refresh download badges'

          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/master; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              echo 'Could not publish download badges after three push attempts.' >&2
              exit 1
            fi
            git fetch --no-tags origin master
            tip=$(git rev-parse origin/master)
            if ! git merge-base --is-ancestor "$base" "$tip"; then
              echo 'The master history changed. Refusing to replay commits.' >&2
              exit 1
            fi
            git rebase origin/master
            if [[ $(git rev-parse HEAD) == "$tip" ]]; then
              exit 0
            fi
            base=$tip
          done
