name: macOS app build

# Heavy build — MANUAL dispatch only (does not auto-run on push to master).
# Builds the PyInstaller .app/.dmg on real Apple-silicon and Intel runners and
# TESTS THE RESULT LIKE A USER WOULD (real transcription with the frozen app,
# GUI launch, bundled ffmpeg/yt-dlp) before uploading it.
#
# Why each step exists — and what broke in earlier builds of this workflow —
# is documented in docs/MACOS_BUILD_NOTES.md. Read it before changing this.
on:
  workflow_dispatch:
  push:
    branches: [macos-app-build]

jobs:
  build-app:
    name: Build + test macOS .app/.dmg (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon
            arch: arm64
            suffix: arm64
          - runner: macos-15-intel  # Intel
            arch: x86_64
            suffix: x64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        id: ver
        run: echo "version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' core/__init__.py)" >> "$GITHUB_OUTPUT"

      # --prefer-binary: several deps' newest release is sdist-only on some
      # macOS/arch combos. The constraints file pins onnxruntime, whose
      # default pick would silently raise the app's minimum macOS to 13/14.
      # stable-ts (torch) and pywhispercpp are optional and left out, as in
      # every shipped build.
      - name: Install deps (slim) + PyInstaller
        run: |
          python -m pip install --upgrade pip
          grep -viE '^\s*(pywhispercpp|stable-ts)' requirements.txt > requirements.slim.txt
          pip install --prefer-binary -c platform/macos/pyinstaller/constraints-macos.txt \
            -r requirements.slim.txt pyinstaller
          pip freeze | grep -iE '^(numpy|onnxruntime|ctranslate2|av|tokenizers|sherpa|faster|pyinstaller)'

      # Self-contained ffmpeg/ffprobe/ffplay + yt-dlp. NOT Homebrew's ffmpeg:
      # it links ~18 dylibs under the Homebrew prefix that PyInstaller does
      # not bundle, and is built for the runner's own macOS (minos 15.0).
      - name: Fetch + verify self-contained bin/ tools
        run: bash platform/macos/pyinstaller/fetch_mac_binaries.sh ${{ matrix.arch }}

      - name: Build .app (PyInstaller)
        run: pyinstaller --noconfirm --clean platform/macos/pyinstaller/whisper_project_mac.spec

      - name: Verify bundle (every Mach-O self-contained, right arch, tools run)
        run: bash platform/macos/pyinstaller/verify_mac_bundle.sh "dist/Whisper Transcriber Suite.app" ${{ matrix.arch }}

      - name: Smoke test like a user (real transcription, GUI launch, yt-dlp)
        run: bash platform/macos/pyinstaller/smoke_test_app.sh "dist/Whisper Transcriber Suite.app" python tiny

      - name: Upload app logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-logs-${{ matrix.arch }}
          path: ~/Library/Logs/WhisperTranscriberSuite/
          if-no-files-found: ignore

      - name: Wrap into .dmg
        run: |
          brew install create-dmg || true
          bash platform/macos/pyinstaller/builddmg.command
          out="WhisperTranscriberSuite-v${{ steps.ver.outputs.version }}-macOS-${{ matrix.suffix }}.dmg"
          mv "dist/Whisper Transcriber Suite-${{ matrix.suffix }}.dmg" "dist/$out"
          (cd dist && shasum -a 256 "$out" | tee "$out.sha256")
          hdiutil verify "dist/$out"

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
