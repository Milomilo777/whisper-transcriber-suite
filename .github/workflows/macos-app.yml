name: macOS app build

# Heavy build: manual dispatch or an explicit build/integration branch push.
# Does not auto-run on push to master.
# Builds the PyInstaller .app/.dmg on real Apple-silicon and Intel runners and
# TESTS THE RESULT LIKE A USER WOULD (real transcription with the frozen app,
# GUI launch, bundled ffmpeg/yt-dlp) before uploading it.
#
# Why each step exists — and what broke in earlier builds of this workflow —
# is documented in docs/MACOS_BUILD_NOTES.md. Read it before changing this.
on:
  workflow_dispatch:
  push:
    branches: [macos-app-build, codex/integration-2.4.x]

permissions:
  contents: read

jobs:
  build-app:
    name: Build + test macOS .app/.dmg (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon
            arch: arm64
            suffix: arm64
            claimed_min: "14.0"
          - runner: macos-15-intel  # Intel
            arch: x86_64
            suffix: x64
            claimed_min: "12.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Observe universal2 rpath repair (non-gating)
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          WTS_PROBE_ARCH: ${{ matrix.arch }}
        run: |
          set -o pipefail
          mkdir -p diagnostics/universal2
          python -u - <<'PY' 2>&1 | tee diagnostics/universal2/probe.log
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          def verify_live_source(root):
              names = ('check_bundle_paths.py', 'list_macho.py', 'repair_bundle_rpaths.py')
              verified = []
              for name in names:
                  live = root / 'platform/macos/pyinstaller' / name
                  frozen = root / 'tools/mac_rpath_native_source' / name
                  if live.read_bytes() != frozen.read_bytes():
                      raise ValueError('Checked-out source differs from diagnostic snapshot: ' + name)
                  verified.append(name)
              return verified

          root = Path.cwd()
          out = root / 'diagnostics/universal2'
          context = {key: os.environ.get(key) for key in (
              'GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'WTS_PROBE_ARCH')}
          context['checkout_commit'] = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          context['checkout_tree'] = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          for name in ('tools/mac_rpath_native_probe.py', 'tools/mac_rpath_native_source/manifest.json'):
              context[name + '_sha256'] = hashlib.sha256((root / name).read_bytes()).hexdigest()
          (out / 'context.json').write_text(json.dumps(context, indent=2) + '\n', encoding='utf-8')
          try:
              if context['checkout_commit'] != context['GITHUB_SHA']:
                  raise ValueError('Checked-out commit differs from job source SHA')
              context['verified_live_source_files'] = verify_live_source(root)
          except Exception as exc:
              result = {'verdict': 'FAIL', 'native_case_pass': False,
                        'phase': 'live_source_preflight', 'reason': str(exc)}
              (out / 'result.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
              print(json.dumps(result), flush=True)
              sys.exit(1)
          (out / 'context.json').write_text(json.dumps(context, indent=2) + '\n', encoding='utf-8')
          sys.exit(subprocess.run([sys.executable, '-u', 'tools/mac_rpath_native_probe.py', str(out)],
                                  timeout=240, check=False).returncode)
          PY

      - name: Upload universal2 rpath diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-universal2-rpath-${{ matrix.arch }}-${{ github.sha }}
          path: diagnostics/universal2/
          if-no-files-found: warn

      - name: Version
        id: ver
        run: echo "version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' core/__init__.py)" >> "$GITHUB_OUTPUT"

      # --prefer-binary: several deps' newest release is sdist-only on some
      # macOS/arch combos. The constraints file pins onnxruntime, whose
      # default pick would silently raise the app's minimum macOS to 13/14.
      # stable-ts (torch) and pywhispercpp are optional and left out, as in
      # every shipped build.
      - name: Install deps (slim) + PyInstaller
        run: |
          python -m pip install --upgrade pip
          grep -viE '^\s*(pywhispercpp|stable-ts)' requirements.txt > requirements.slim.txt
          pip install --prefer-binary -c platform/macos/pyinstaller/constraints-macos.txt \
            -r requirements.slim.txt pyinstaller
          pip freeze | grep -iE '^(numpy|onnxruntime|ctranslate2|av|tokenizers|sherpa|faster|pyinstaller)'

      # Extra check, never a gate: which native hooks this runner's Python/Tk
      # really supports (app menu, Window/Help menus, OpenDocument, Dock click).
      # The app's macOS integration (app/mac_native.py) is built on the result
      # measured in a macOS 13 VM; this shows whether the runners agree. The
      # process may not be an app bundle here (setup-python), so a FAIL line
      # is information, not a build failure. See docs/MACOS_BUILD_NOTES.md.
      - name: Probe native macOS hooks (extra check)
        continue-on-error: true
        timeout-minutes: 3
        run: python -u tools/mac_native_probe.py

      # Self-contained ffmpeg/ffprobe + yt-dlp + deno. NOT Homebrew's ffmpeg:
      # it links ~18 dylibs under the Homebrew prefix that PyInstaller does
      # not bundle, and is built for the runner's own macOS (minos 15.0).
      - name: Fetch + verify self-contained bin/ tools
        run: bash platform/macos/pyinstaller/fetch_mac_binaries.sh ${{ matrix.arch }}

      - name: Build .app (PyInstaller)
        run: pyinstaller --noconfirm --clean platform/macos/pyinstaller/whisper_project_mac.spec

      - name: Verify bundle (every Mach-O self-contained, right arch, tools run)
        env:
          WTS_CLAIMED_MACOS_MIN: ${{ matrix.claimed_min }}
        run: bash platform/macos/pyinstaller/verify_mac_bundle.sh "dist/Whisper Transcriber Suite.app" ${{ matrix.arch }}

      - name: Smoke test like a user (real transcription, GUI launch, yt-dlp)
        run: bash platform/macos/pyinstaller/smoke_test_app.sh "dist/Whisper Transcriber Suite.app" python tiny

      - name: Upload app logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-logs-${{ matrix.arch }}
          path: ~/Library/Logs/WhisperTranscriberSuite/
          if-no-files-found: ignore

      - name: Wrap into .dmg
        run: |
          brew install create-dmg || true
          bash platform/macos/pyinstaller/builddmg.command
          out="WhisperTranscriberSuite-v${{ steps.ver.outputs.version }}-macOS-${{ matrix.suffix }}.dmg"
          mv "dist/Whisper Transcriber Suite-${{ matrix.suffix }}.dmg" "dist/$out"
          # builddmg.command already verifies and runs the copied image before success.

      - name: Upload .dmg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: |
            dist/*.dmg
          if-no-files-found: error
